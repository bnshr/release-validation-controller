apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: validationruns.learning.example.io
spec:
  group: learning.example.io
  scope: Namespaced
  names:
    plural: validationruns
    singular: validationrun
    kind: ValidationRun
    shortNames: [vrun]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [version, suite]
            properties:
              version: {type: string, minLength: 1}
              suite: {type: string, enum: [smoke, network, storage, gpu-smoke, fail]}
              capacity: {type: string, enum: [cpu, gpu-simulated]}
              timeoutSeconds: {type: integer, format: int64, minimum: 1}
              retries: {type: integer, format: int32, minimum: 0, maximum: 5}
              cancel: {type: boolean}
          status:
            type: object
            properties:
              phase: {type: string}
              attempt: {type: integer, format: int32}
              startedAt: {type: string, format: date-time}
              completedAt: {type: string, format: date-time}
              reason: {type: string}
              report: {type: string}
              observedGeneration: {type: integer, format: int64}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: release-validation-controller
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-validation-controller
  namespace: default
rules:
- apiGroups: [learning.example.io]
  resources: [validationruns]
  verbs: [get, list, watch, update, patch]
- apiGroups: [learning.example.io]
  resources: [validationruns/status]
  verbs: [get, update, patch]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [get, list, watch, create, delete]
- apiGroups: [""]
  resources: [configmaps]
  verbs: [get, list, watch, create, update]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: release-validation-controller
  namespace: default
subjects:
- kind: ServiceAccount
  name: release-validation-controller
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: release-validation-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-validation-leader
  namespace: default
rules:
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: release-validation-leader
  namespace: default
subjects:
- kind: ServiceAccount
  name: release-validation-controller
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: release-validation-leader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-validation-controller
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: {app: release-validation-controller}
  template:
    metadata:
      labels: {app: release-validation-controller}
    spec:
      serviceAccountName: release-validation-controller
      containers:
      - name: controller
        image: release-validation-controller:local
        imagePullPolicy: Never
        args: ["--namespace=default", "--cpu-capacity=2", "--gpu-simulated-capacity=1"]
        resources:
          requests: {cpu: 25m, memory: 64Mi}
          limits: {memory: 256Mi}
